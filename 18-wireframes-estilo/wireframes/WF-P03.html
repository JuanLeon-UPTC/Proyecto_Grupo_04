<title>WF-P03 · Reporte semanal de rotación</title>
<link rel="stylesheet" href="../estilo/componentes.css">
</head>
<body>
  <h1>Reporte semanal de rotación</h1>
  <p>Semana del 3 al 9 de noviembre</p>

  <table class="reporte">
    <thead><tr><th>Producto</th><th>Rotación (8 semanas)</th><th>Acción</th></tr></thead>
    <tbody>
      <tr class="fila-marcada">
        <td>Almojábana</td>
        <td>12 % del promedio ⚠ rotación baja</td>
        <td><button class="boton boton-secundario">Descontinuar</button></td>
      </tr>
      <tr>
        <td>Pan de sal</td>
        <td>95 % del promedio</td>
        <td>—</td>
      </tr>
      <tr>
        <td>Empanada especial</td>
        <td>menos de 4 semanas de datos</td>
        <td>—</td>
      </tr>
    </tbody>
  </table>

  <div class="aviso aviso-exito" role="status" hidden>✓ Decisión registrada con el reporte de respaldo</div>
</body>
</html>
