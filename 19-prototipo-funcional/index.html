<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo v0.1 · P-01 Registrar venta</title>
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <h1>Registrar venta</h1>
  <div id="aviso" class="aviso" hidden></div>

  <section id="paso-agregar">
    <div class="campo">
      <label for="producto">Producto</label>
      <select id="producto">
        <option value="">Selecciona…</option>
        <option>Pan de sal</option>
        <option>Croissant</option>
        <option>Torta de chocolate</option>
      </select>
      <div class="error-texto" id="error-producto"></div>
    </div>
    <div class="campo">
      <label for="cantidad">Cantidad</label>
      <input id="cantidad" type="number" min="1" value="1">
      <div class="error-texto" id="error-cantidad"></div>
    </div>
    <button id="btn-agregar" class="boton boton-primario">Agregar</button>

    <h2>Venta en curso</h2>
    <div id="lineas"></div>
    <p id="total" class="total">Total: $0</p>
    <button id="btn-completar" class="boton boton-secundario">Marcar venta completa</button>
  </section>

  <section id="paso-cobrar" hidden>
    <p id="total-cobrar" class="total"></p>
    <button id="btn-confirmar-pago" class="boton boton-primario">Confirmar pago</button>
    <button id="btn-cancelar" class="boton boton-secundario">Cancelar venta</button>
    <div id="confirmar-cancelar" class="aviso aviso-advertencia" hidden>
      ¿Seguro que quieres descartar esta venta? (RF-010)
      <button id="btn-cancelar-si" class="boton boton-primario">Sí, cancelar</button>
      <button id="btn-cancelar-no" class="boton boton-secundario">No</button>
    </div>
  </section>

  <hr>
  <label><input type="checkbox" id="chk-simular-falla"> Simular falla de guardado (demostración de RF-002)</label>
  <p><a href="autoprueba.html">Ver autoprueba</a></p>

  <script src="datos/datos.js"></script>
  <script src="datos/reglas-datos.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/pantallas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
